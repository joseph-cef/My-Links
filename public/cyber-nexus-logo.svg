<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26C6FF"/>
      <stop offset="50%" stop-color="#6B5BFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
  </defs>
  <!-- Hexagon outer shape with pointed top -->
  <path d="M100 8 L178 52 L178 148 L100 192 L22 148 L22 52 Z" 
        stroke="url(#logoGrad)" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <!-- Inner vertical divider -->
  <line x1="100" y1="60" x2="100" y2="160" stroke="url(#logoGrad)" stroke-width="4"/>
  <!-- N letter - left diagonal -->
  <path d="M70 140 L70 72 L130 140 L130 72" 
        stroke="url(#logoGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Circuit traces - left side -->
  <line x1="55" y1="90" x2="70" y2="90" stroke="url(#logoGrad)" stroke-width="3"/>
  <circle cx="55" cy="90" r="4" fill="url(#logoGrad)"/>
  <line x1="55" y1="120" x2="70" y2="120" stroke="url(#logoGrad)" stroke-width="3"/>
  <circle cx="55" cy="120" r="4" fill="url(#logoGrad)"/>
  <!-- Circuit traces - right side -->
  <line x1="130" y1="95" x2="145" y2="95" stroke="url(#logoGrad)" stroke-width="3"/>
  <circle cx="145" cy="95" r="4" fill="url(#logoGrad)"/>
  <line x1="130" y1="125" x2="145" y2="125" stroke="url(#logoGrad)" stroke-width="3"/>
  <circle cx="145" cy="125" r="4" fill="url(#logoGrad)"/>
  <!-- Small circuit node top -->
  <circle cx="100" cy="55" r="3.5" fill="url(#logoGrad)"/>
</svg>
